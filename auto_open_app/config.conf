# ============================================================
# 自动打开应用 - 配置文件
# ============================================================

# 目标应用包名（薪人薪事）
PACKAGE_NAME="com.client.xrxs.com.xrxsapp"

# 目标应用的启动 Activity（主界面，一般无需修改）
# 如果启动失败，可通过 adb shell dumpsys package ${PACKAGE_NAME} | grep -A1 "android.intent.action.MAIN" 查找
LAUNCHER_ACTIVITY=""

# 每日定时打开时间（24小时制，格式 HH:MM）
SCHEDULE_TIME="09:00"

# 日志文件路径
LOG_FILE="${HOME}/.auto_open_app.log"

# 最大日志保留行数
LOG_MAX_LINES=500